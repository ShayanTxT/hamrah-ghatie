[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamrah-ghatie"
version = "1.0.0"
description = "همراه قطعی — an offline-first Windows desktop companion for internet blackouts (Persian / RTL)."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "ShayanTxT (shayan.txt)" },
]
keywords = [
    "offline", "iran", "internet-blackout", "persian", "farsi", "rtl",
    "pyside6", "kiwix", "zim", "llama-cpp", "gguf", "fts5", "lan",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications",
    "Topic :: Utilities",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/ShayanTxT/hamrah-ghatie"
Repository = "https://github.com/ShayanTxT/hamrah-ghatie"
Issues = "https://github.com/ShayanTxT/hamrah-ghatie/issues"
Changelog = "https://github.com/ShayanTxT/hamrah-ghatie/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ShayanTxT/hamrah-ghatie/blob/main/README.en.md"
"Documentation (فارسی)" = "https://github.com/ShayanTxT/hamrah-ghatie/blob/main/README.fa.md"

[project.scripts]
hamrah-ghatie = "hamrah.main:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["hamrah*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", ".venv", "samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E402",  # importهای محلی بعد از تنظیم sys.path
    "E501",  # طول خطها در رشتههای فارسی کنترل دستی میشود
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.coverage.run]
source = ["hamrah"]
omit = ["hamrah/ui/*", "tests/*"]
