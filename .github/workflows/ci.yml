name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Smoke-check core imports (no Qt required)
        run: >-
          python -c "from hamrah.core import netcheck, downloader, library, zim_reader, llama;
          from hamrah.core.lan import crypto, node; print('core imports OK')"

  packaging-spec:
    name: Validate PyInstaller spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: Build with PyInstaller (spec must stay valid)
        run: pyinstaller --noconfirm --clean hamrah-ghatie.spec
      - name: Confirm bundled font exists
        run: test -f dist/HamrahGhatie/_internal/assets/fonts/Vazirmatn-Regular.ttf && echo "font bundled"
